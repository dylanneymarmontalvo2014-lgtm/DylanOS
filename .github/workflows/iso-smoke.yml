name: ISO QEMU smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/iso-smoke.yml'
      - 'Dockerfile'
      - 'install-deps.sh'
      - 'scripts/build.sh'
      - 'scripts/test-iso.sh'
      - 'packages/**'
      - 'configs/**'
      - 'branding/**'
      - 'themes/**'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install QEMU and ISO inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf xorriso squashfs-tools
      - name: Build the ISO builder image
        run: docker build --tag dylanos-builder:iso-smoke .
      - name: Build a serial-enabled smoke-test ISO
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DYLANOS_SERIAL_CONSOLE=1 \
            dylanos-builder:iso-smoke
      - name: Inspect and boot the ISO in BIOS and UEFI
        run: |
          iso="$(find build/live-build -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [[ -z "$iso" ]]; then
            echo 'No ISO produced in build/live-build.' >&2
            exit 1
          fi
          scripts/test-iso.sh "$iso"
