name: Check beta
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/dylanos-installer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bash-completion desktop-file-utils libegl1 libopengl0 libxkbcommon0
      - run: pip install -r apps/workspace/requirements-dev.txt
      - run: bash scripts/check.sh
      - name: Validar configuración de Compose
        run: docker compose config --quiet
      - name: Construir imagen Docker
        run: docker build --tag dylanos-builder:ci .
      - name: Ejecutar QA dentro del contenedor
        run: docker run --rm --volume "$PWD:/workspace" --workdir /workspace dylanos-builder:ci make check
