name: Validate release tag
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils libegl1 libopengl0 libxkbcommon0
      - run: pip install -r apps/workspace/requirements-dev.txt
      - run: bash scripts/check.sh
