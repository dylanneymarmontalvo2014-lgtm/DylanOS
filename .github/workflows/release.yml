name: Build ISO artifact (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Debian Live build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends live-build debootstrap squashfs-tools xorriso
      - name: Run static tests
        run: scripts/test.sh
      - name: Build ISO
        run: sudo scripts/build.sh
      - name: Prepare ISO and checksum artifacts
        run: |
          mapfile -t iso_files < <(find build/live-build -maxdepth 1 -type f -name '*.iso' -print)
          if [[ "${#iso_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one ISO; found %s.\n' "${#iso_files[@]}" >&2
            exit 1
          fi
          cp -- "${iso_files[0]}" "$GITHUB_WORKSPACE/DylanOS-amd64.iso"
          (cd "$GITHUB_WORKSPACE" && sha256sum DylanOS-amd64.iso > DylanOS-amd64.iso.sha256)
      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DylanOS-${{ github.run_id }}-amd64
          path: |
            DylanOS-amd64.iso
            DylanOS-amd64.iso.sha256
          if-no-files-found: error
