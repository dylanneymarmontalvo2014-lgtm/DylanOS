<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d2a"/>
      <stop offset="1" stop-color="#a80f19"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo de la calculadora -->
  <rect x="44" y="20" width="168" height="216" rx="30" fill="url(#bodyGrad)" stroke="#e11d2a" stroke-width="3"/>

  <!-- Pantalla -->
  <rect x="66" y="44" width="124" height="46" rx="10" fill="#141414"/>
  <text x="178" y="76" text-anchor="end" font-family="'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="300">0</text>

  <!-- Fila 1: AC, %, / -->
  <rect x="66" y="104" width="34" height="30" rx="10" fill="#2b2b2b"/>
  <rect x="111" y="104" width="34" height="30" rx="10" fill="#2b2b2b"/>
  <rect x="156" y="104" width="34" height="30" rx="10" fill="url(#screenGrad)"/>

  <!-- Fila 2 -->
  <rect x="66" y="142" width="34" height="30" rx="10" fill="#2b2b2b"/>
  <rect x="111" y="142" width="34" height="30" rx="10" fill="#2b2b2b"/>
  <rect x="156" y="142" width="34" height="30" rx="10" fill="url(#screenGrad)"/>

  <!-- Fila 3 -->
  <rect x="66" y="180" width="34" height="30" rx="10" fill="#2b2b2b"/>
  <rect x="111" y="180" width="34" height="30" rx="10" fill="#2b2b2b"/>
  <rect x="156" y="180" width="34" height="30" rx="10" fill="url(#screenGrad)"/>
</svg>
