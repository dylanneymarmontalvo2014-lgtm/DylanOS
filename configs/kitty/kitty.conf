# DylanOS Console (Kitty) — identidad Crimson
# Paleta oficial: #DC143C sobre #0A0A0A. Transparencia real (KWin aplica blur).

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
disable_ligatures never

shell /bin/bash
editor .

remember_window_size yes
initial_window_width 116c
initial_window_height 36c
window_padding_width 20 24
window_margin_width 0
placement_strategy center
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.05
window_alert_on_bell no
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0
url_style curly
url_color #ff5274
detect_urls yes
scrollback_lines 50000
scrollback_pager_history_size 64
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Cristal oscuro: KWin compone la transparencia y Kitty solicita el desenfoque.
background_opacity 0.50
dynamic_background_opacity yes
background_blur 24

foreground #F5F5F5
background #0A0A0A
selection_foreground #FFFFFF
selection_background #DC143C
cursor #DC143C
cursor_text_color #0A0A0A
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.65
cursor_underline_thickness 2.0

color0  #0A0A0A
color8  #4A4450
color1  #DC143C
color9  #ff2a54
color2  #3dd68c
color10 #6ee7a8
color3  #f0c14a
color11 #ffd76a
color4  #5b8def
color12 #8bb4ff
color5  #c45c8a
color13 #ff5274
color6  #4ecdc4
color14 #7ee8e0
color7  #B3B3B3
color15 #FFFFFF

active_border_color #DC143C
inactive_border_color #2e2736
bell_border_color #ff5274

# Barra de pestañas moderna: ▲ marca la pestaña activa, fondo continuo.
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_min_tabs 1
tab_bar_align left
tab_bar_background #0A0A0A
tab_bar_margin_width 12.0
tab_bar_margin_height 8.0 4.0
active_tab_foreground #DC143C
active_tab_background #0A0A0A
active_tab_font_style bold
inactive_tab_foreground #4A4450
inactive_tab_background #0A0A0A
inactive_tab_font_style normal
tab_title_template "  {index}  "
active_tab_title_template "  ▲ {index}  "

map kitty_mod+t new_tab
map kitty_mod+w close_tab
map kitty_mod+enter new_window
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# El protocolo de gráficos de Kitty (neofetch --backend kitty / icat) no
# requiere remote control; se deja desactivado por seguridad.
allow_remote_control no
linux_display_server auto
wayland_titlebar_color background
term xterm-kitty
