# DylanOS Console (Kitty) — identidad Crimson
# Paleta oficial: #DC143C sobre #0A0A0A. Transparencia real (KWin aplica blur).

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10.5
disable_ligatures never

shell /bin/bash
editor .

remember_window_size yes
initial_window_width 112c
initial_window_height 34c
window_padding_width 12 16
window_margin_width 0
placement_strategy center
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.05
window_alert_on_bell no
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0
url_style curly
url_color #ff5274
detect_urls yes
scrollback_lines 50000
scrollback_pager_history_size 64
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Transparencia: Konsole usaba Opacity=0.82; se replica y se permite ajustar.
background_opacity 0.80
dynamic_background_opacity yes
background_blur 28

foreground #F5F5F5
background #0A0A0A
selection_foreground #FFFFFF
selection_background #DC143C
cursor #DC143C
cursor_text_color #0A0A0A
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.65
cursor_underline_thickness 2.0

color0  #0A0A0A
color8  #4A4450
color1  #DC143C
color9  #ff2a54
color2  #3dd68c
color10 #6ee7a8
color3  #f0c14a
color11 #ffd76a
color4  #5b8def
color12 #8bb4ff
color5  #c45c8a
color13 #ff5274
color6  #4ecdc4
color14 #7ee8e0
color7  #B3B3B3
color15 #FFFFFF

active_border_color #DC143C
inactive_border_color #2e2736
bell_border_color #ff5274

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_align left
active_tab_foreground #FFFFFF
active_tab_background #DC143C
inactive_tab_foreground #B3B3B3
inactive_tab_background #1A1A1A
tab_title_template "{index}"
active_tab_title_template "{index} {title}"

map kitty_mod+t new_tab
map kitty_mod+w close_tab
map kitty_mod+enter new_window
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# El protocolo de gráficos de Kitty (neofetch --backend kitty / icat) no
# requiere remote control; se deja desactivado por seguridad.
allow_remote_control no
linux_display_server auto
wayland_titlebar_color background
term xterm-kitty
