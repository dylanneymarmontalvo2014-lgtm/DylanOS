# DylanOS Console — neofetch
# Logo: imagen real branding/logo.png (no ASCII). Backend Kitty + ImageMagick.

print_info() {
    info title
    info underline

    prin "$(color 1)─── DylanOS · Resumen del sistema ─────────────"
    info "Sistema" distro
    info "Equipo" model
    info "Kernel" kernel
    info "Encendido" uptime
    info "Paquetes" packages
    info "Consola" shell
    info "Resolución" resolution
    info "Escritorio" de
    info "Ventanas" wm
    info "Terminal" term
    info "Procesador" cpu
    info "Gráficos" gpu
    info "Memoria" memory
    info "Disco" disk
    info "Idioma" locale
    prin "$(color 8)──────────────────────────────────────────────"
    info cols
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="on"
gtk_shorthand="on"
de_version="on"
bold="on"
underline_enabled="on"
underline_char="-"
separator=" "
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"
cpu_display="off"
memory_display="off"
disk_display="off"
stdout="off"

# Paleta DylanOS: crimson / blanco / gris (índices 256-color).
# 1 título, 2 @, 3 subrayado, 4 claves, 5 separador, 6 valores
colors=(196 255 196 196 245 255)

image_backend="kitty"
image_source="/usr/share/dylanos/neofetch/logo.png"
image_size="280px"
crop_mode="fit"
crop_offset="center"
yoffset=0
xoffset=0
gap=3
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/neofetch"
background_color=
ascii_bold="on"
ascii_colors=(196 245)
