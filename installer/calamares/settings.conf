---
modules-search:
  - local
  - /usr/lib/calamares/modules
branding: dylanos
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - bootloader
      - umount
  - show:
      - finished
